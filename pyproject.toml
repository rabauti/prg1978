[project]
name = "prg1978-opikulauetekorpus"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "jupyterlab>=4.0.10,<4.1.0",
    "ipykernel>=6.28.0,<6.29.0",
    "networkx>=3.2.1,<3.3.0",
    "tqdm>=4.66.1,<4.67.0",
    "matplotlib",
    "pandas",
    "conllu==6.0.0",
    "graphviz==0.12",
    "pygraphviz>=1.12,<1.13",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
